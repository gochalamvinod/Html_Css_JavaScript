<html lang="en">
    <head>
        <title>Table</title>
    </head>
    <body>
        <link rel="stylesheet" href="style.css">
        <table id="table">
            <thead>
                <tr id="heading" class="data">
                    <th class="data">Name</th>
                    <th class="data">Age</th>
                    <th class="data">Number</th>
                </tr>
            </thead>
            <tbody id="tablebody">
            </tbody>
            <tfoot  id="tablefooter">              
            </tfoot>
        </table>
        <div id="input">
            <input id="name" type="text" placeholder="enter ur name">
            <input id="age" type="number" placeholder="enter ur age">
            <input id="number" type="text" placeholder="enter ur number">
            <button id="submit">Add</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
